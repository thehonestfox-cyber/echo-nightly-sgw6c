name: Wear OS build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wear-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug + nightly APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :app:assembleDebug :app:assembleNightly --stacktrace --no-daemon

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/echo-wear-debug.apk
          cp app/build/outputs/apk/nightly/app-nightly.apk out/echo-wear-nightly.apk
          sha256sum out/*.apk > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: echo-wear-apk
          path: out/*
          if-no-files-found: error
          retention-days: 30
