name: Wear OS build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wear-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build debug + nightly APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleNightly --continue --no-daemon --console=plain 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Build failed on \`${GITHUB_SHA::7}\`"
            echo
            echo '```'
            grep -niE "^e: |error|aapt|FAILED|what went wrong|could not|caused by|unresolved|^ *> " build.log | grep -v "^[0-9]*:> Task " | cut -c1-600 | head -c 40000
            echo '```'
            echo
            echo '<details><summary>Log tail</summary>'
            echo
            echo '```'
            tail -n 120 build.log | cut -c1-400 | head -c 25000
            echo '```'
            echo '</details>'
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          # Also publish the summary as a commit comment so it can be read through the REST API.
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(head -c 60000 summary.md)" >/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/echo-wear-debug.apk
          cp app/build/outputs/apk/nightly/app-nightly.apk out/echo-wear-nightly.apk
          sha256sum out/*.apk > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: echo-wear-apk
          path: out/*
          if-no-files-found: error
          retention-days: 30

      # Rolling pre-release so the APKs can be downloaded without a GitHub login
      # (Actions artifacts require one). The `nightly` tag always points at the last green build.
      - name: Publish nightly pre-release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nightly"
          TITLE="Echo Wear nightly $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})"
          NOTES="Build automatica di \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7} ($(date -u +'%Y-%m-%d %H:%M UTC')).

          - \`echo-wear-nightly.apk\`: build ottimizzata (R8), firmata con la chiave debug
          - \`echo-wear-debug.apk\`: build di debug
          - \`SHA256SUMS.txt\`: checksum

          Installazione sul Galaxy Watch 6 Classic: \`adb connect <ip-orologio>:5555 && adb install -r echo-wear-nightly.apk\`"
          # Re-create the release so that the tag moves to the current commit.
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" out/echo-wear-nightly.apk out/echo-wear-debug.apk out/SHA256SUMS.txt \
            --title "$TITLE" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
